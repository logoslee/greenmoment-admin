<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>재고·순이익 대시보드</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
<style>
  :root{
    --blue:#2563eb;
    --blue-dark:#1d4ed8;
    --blue-light:#bfdbfe;
    --blue-bg:#eff6ff;
    --green:#16a34a;
    --green-bg:#f0fdf4;
    --red:#dc2626;
    --text:#0f172a;
    --sub:#64748b;
    --line:#e5e7eb;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:#ffffff;
    color:var(--text);
    font-family:'Pretendard Variable','Pretendard',-apple-system,BlinkMacSystemFont,sans-serif;
  }
  .wrap{ max-width:1120px; margin:0 auto; padding:24px 16px 60px; }
  .topbar{ display:flex; align-items:center; justify-content:space-between; margin-bottom:20px; }
  h1{ font-size:22px; font-weight:700; margin:0; }
  a.input-link{
    font-size:13px; color:#fff; background:var(--blue); text-decoration:none; font-weight:600;
    padding:8px 14px; border-radius:99px;
  }
  a.dash-link{ font-size:13px; color:var(--blue); text-decoration:none; font-weight:600; }
  .nav-links{ display:flex; align-items:center; gap:14px; flex-wrap:wrap; justify-content:flex-end; }
  .card{
    background:#fff; border:1px solid var(--line); border-radius:14px; padding:18px 20px;
    box-shadow:0 1px 3px rgba(15,23,42,0.04);
  }
  .cards{ display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin-bottom:20px; }
  .card-label{ font-size:13px; color:var(--sub); font-weight:600; margin-bottom:8px; }
  .card-value{ font-size:26px; font-weight:700; }
  .card-value.neg{ color:var(--red); }
  .card-sub{ font-size:12px; color:var(--sub); margin-top:6px; }

  .period-grid{ display:grid; grid-template-columns:repeat(4,1fr); gap:14px; }
  .period-label{ font-size:12px; color:var(--sub); font-weight:600; margin-bottom:6px; }
  .period-value{ font-size:20px; font-weight:700; }
  .period-value.neg{ color:var(--red); }
  @media (max-width:560px){
    .period-grid{ grid-template-columns:repeat(2,1fr); gap:16px; }
  }

  .range-form{
    display:flex; gap:10px; align-items:flex-end; flex-wrap:wrap;
    margin-top:16px; padding-top:16px; border-top:1px solid var(--line);
  }
  .range-field{ display:flex; flex-direction:column; gap:4px; }
  .range-field label{ font-size:11px; color:var(--sub); font-weight:600; }
  .range-field input{
    padding:8px 10px; border:1px solid var(--line); border-radius:8px; font-size:14px; font-family:inherit; background:#fff;
  }
  .range-btn{
    background:var(--blue); color:#fff; border:none; border-radius:8px; padding:9px 16px;
    font-size:13px; font-weight:700; cursor:pointer; font-family:inherit;
  }
  .range-result{ margin-top:12px; font-size:13px; }

  .mid{ display:grid; grid-template-columns:1.4fr 1fr; gap:14px; margin-bottom:20px; }
  .panel-title{ font-size:15px; font-weight:700; margin-bottom:14px; }
  .legend{ display:flex; gap:14px; font-size:12px; color:var(--sub); margin-bottom:10px; }
  .legend span{ display:inline-flex; align-items:center; gap:5px; }
  .dot{ width:9px; height:9px; border-radius:99px; display:inline-block; }

  .bottom{ display:grid; grid-template-columns:repeat(3,1fr); gap:14px; }
  .bottom > .card{ min-width:0; }
  .stock-row{ display:flex; align-items:center; gap:8px; padding:7px 0; min-width:0; }
  .stock-name{ width:74px; flex-shrink:0; font-size:13px; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .stock-bar-track{ flex:1; min-width:16px; height:9px; background:var(--blue-bg); border-radius:99px; overflow:hidden; }
  .stock-bar-fill{ height:100%; background:var(--blue); border-radius:99px; }
  .stock-amount{ width:64px; flex-shrink:0; text-align:right; font-size:12px; font-weight:700; color:var(--blue-dark); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .stock-value{ width:76px; flex-shrink:0; text-align:right; font-size:11px; color:var(--sub); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .stock-subtotal{ font-size:12px; color:var(--sub); margin-bottom:8px; padding-bottom:8px; border-bottom:1px solid var(--line); }
  .stock-subtotal b{ color:var(--text); }
  .total-value{ font-size:26px; font-weight:700; }

  table.waste-table{ width:100%; border-collapse:collapse; font-size:13px; }
  table.waste-table th{ text-align:left; color:var(--sub); font-weight:600; padding:6px 4px; border-bottom:1px solid var(--line); font-size:12px; }
  table.waste-table td{ padding:7px 4px; border-bottom:1px solid var(--line); }
  table.waste-table tr:last-child td{ border-bottom:none; }

  .loading, .error-box, .empty-box{ color:var(--sub); font-size:14px; padding:30px 0; text-align:center; }
  .error-box{ color:var(--red); }

  @media (max-width:900px){
    .cards{ grid-template-columns:repeat(2,1fr); }
    .mid{ grid-template-columns:1fr; }
    .bottom{ grid-template-columns:1fr 1fr; }
  }
  @media (max-width:560px){
    .cards{ grid-template-columns:1fr; }
    .bottom{ grid-template-columns:1fr; }
    .card-value{ font-size:22px; }
  }
</style>
</head>
<body>

<div class="wrap" id="app">
  <div class="topbar">
    <h1>재고·순이익 대시보드</h1>
    <div class="nav-links">
      <a class="dash-link" href="items.html">품목관리</a>
      <a class="dash-link" href="shipments.html">택배업로드</a>
      <a class="dash-link" href="labor.html">인건비</a>
      <a class="input-link" href="input.html">+ 오늘 입력</a>
    </div>
  </div>

  <div class="card" style="margin-bottom:20px; display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:10px;">
    <div>
      <div style="font-size:14px; font-weight:700;">구글시트 내보내기</div>
      <div style="font-size:12px; color:var(--sub); margin-top:2px;" id="sheetsStatus">이번 달 매출·비용·순이익 요약과 품목별 출고 집계를 구글시트에 씁니다.</div>
    </div>
    <button class="range-btn" onclick="exportToSheets()">지금 내보내기</button>
  </div>

  <div class="cards">
    <div class="card" id="cardRevenue"><div class="loading">불러오는 중...</div></div>
    <div class="card" id="cardProfit"><div class="loading">불러오는 중...</div></div>
    <div class="card" id="cardRaw"><div class="loading">불러오는 중...</div></div>
    <div class="card" id="cardBox"><div class="loading">불러오는 중...</div></div>
  </div>

  <div class="card" style="margin-bottom:20px;">
    <div class="panel-title">기간별 순이익</div>
    <div class="period-grid" id="periodProfit"><div class="loading">불러오는 중...</div></div>

    <div class="range-form">
      <div class="range-field"><label>시작일</label><input type="date" id="rangeStart"></div>
      <div class="range-field"><label>종료일</label><input type="date" id="rangeEnd"></div>
      <button class="range-btn" onclick="queryCustomRange()">조회</button>
    </div>
    <div class="range-result" id="customRangeResult"></div>
  </div>

  <div class="mid">
    <div class="card">
      <div class="panel-title">최근 30일 매출 / 순이익 추이</div>
      <div class="legend">
        <span><span class="dot" style="background:var(--blue)"></span>매출</span>
        <span><span class="dot" style="background:var(--green)"></span>순이익</span>
      </div>
      <div id="trendChart"><div class="loading">불러오는 중...</div></div>
    </div>
    <div class="card">
      <div class="panel-title">폐기 내역</div>
      <div class="range-form" style="margin-top:0; padding-top:0; border-top:none;">
        <div class="range-field"><label>시작일</label><input type="date" id="wasteRangeStart"></div>
        <div class="range-field"><label>종료일</label><input type="date" id="wasteRangeEnd"></div>
        <button class="range-btn" onclick="loadWasteRange()">조회</button>
      </div>
      <div id="wasteTable" style="margin-top:14px;"><div class="loading">불러오는 중...</div></div>
    </div>
  </div>

  <div class="card" style="margin-bottom:20px;">
    <div class="panel-title">재고자산 총액 (매입단가 기준)</div>
    <div id="stockValueTotal"><div class="loading">불러오는 중...</div></div>
  </div>

  <div class="bottom">
    <div class="card">
      <div class="panel-title">원물 재고 현황</div>
      <div class="stock-subtotal" id="rawStockTotal"></div>
      <div id="rawStock"><div class="loading">불러오는 중...</div></div>
    </div>
    <div class="card">
      <div class="panel-title">박스 재고 현황</div>
      <div class="stock-subtotal" id="boxStockTotal"></div>
      <div id="boxStock"><div class="loading">불러오는 중...</div></div>
    </div>
    <div class="card">
      <div class="panel-title">부자재 재고 현황</div>
      <div class="stock-subtotal" id="supplyStockTotal"></div>
      <div id="supplyStock"><div class="loading">불러오는 중...</div></div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="config.js"></script>
<script>
  const { createClient } = supabase;
  let db = null;
  try{
    db = createClient(window.SUPABASE_CONFIG.url, window.SUPABASE_CONFIG.anonKey);
  }catch(e){
    document.getElementById('app').innerHTML =
      `<div class="topbar"><h1>재고·순이익 대시보드</h1></div>
       <div class="card error-box">config.js에 Supabase URL/anon key가 아직 설정되지 않았습니다.<br>README.md의 1단계를 먼저 진행해주세요.</div>`;
    throw e;
  }

  function fmt(n){ return Number(n || 0).toLocaleString('ko-KR'); }
  function todayStr(){
    const d = new Date();
    const tz = d.getTimezoneOffset() * 60000;
    return new Date(d - tz).toISOString().slice(0,10);
  }
  function dateStrDaysAgo(n){
    const d = new Date(Date.now() - n*86400000);
    const tz = d.getTimezoneOffset() * 60000;
    return new Date(d - tz).toISOString().slice(0,10);
  }

  (function initRangeDefaults(){
    const today = todayStr();
    const monthStart = today.slice(0,8) + '01';
    document.getElementById('rangeStart').value = monthStart;
    document.getElementById('rangeEnd').value = today;
    document.getElementById('wasteRangeStart').value = monthStart;
    document.getElementById('wasteRangeEnd').value = today;
  })();

  async function loadWasteRange(){
    const start = document.getElementById('wasteRangeStart').value;
    const end = document.getElementById('wasteRangeEnd').value;
    const el = document.getElementById('wasteTable');
    if(!start || !end){ el.innerHTML = '<div class="error-box">시작일과 종료일을 선택하세요</div>'; return; }
    if(start > end){ el.innerHTML = '<div class="error-box">시작일이 종료일보다 늦을 수 없어요</div>'; return; }
    el.innerHTML = '<div class="loading">불러오는 중...</div>';
    const { data, error } = await db.from('stock_movements')
      .select('*, items(name,unit)')
      .eq('movement_type', '폐기')
      .gte('movement_date', start).lte('movement_date', end)
      .order('movement_date', { ascending: false });
    if(error){ el.innerHTML = `<div class="error-box">불러오기 실패: ${error.message}</div>`; return; }
    renderWasteTable(data || []);
  }

  async function queryCustomRange(){
    const start = document.getElementById('rangeStart').value;
    const end = document.getElementById('rangeEnd').value;
    const el = document.getElementById('customRangeResult');
    if(!start || !end){ el.innerHTML = '<span style="color:var(--red)">시작일과 종료일을 선택하세요</span>'; return; }
    if(start > end){ el.innerHTML = '<span style="color:var(--red)">시작일이 종료일보다 늦을 수 없어요</span>'; return; }
    el.innerHTML = '<div class="loading">조회 중...</div>';
    const { data, error } = await db.from('v_daily_summary').select('*').gte('date', start).lte('date', end);
    if(error){ el.innerHTML = `<span style="color:var(--red)">조회 실패: ${error.message}</span>`; return; }
    const rows = data || [];
    const sum = key => rows.reduce((a, r) => a + Number(r[key] || 0), 0);
    const revenue = sum('revenue'), profit = sum('net_profit');
    el.innerHTML = `
      <div class="period-label">${start} ~ ${end} (기록 있는 날 ${rows.length}일)</div>
      <div class="period-value ${profit < 0 ? 'neg' : ''}" style="margin-top:4px;">순이익 ${fmt(profit)}원</div>
      <div style="color:var(--sub); margin-top:4px;">매출 ${fmt(revenue)}원</div>`;
  }

  function renderPeriodProfit(summaryRows){
    const today = todayStr();
    const yesterday = dateStrDaysAgo(1);
    const weekStart = dateStrDaysAgo(6);

    const todayProfit = summaryRows.find(r => r.date === today)?.net_profit || 0;
    const yesterdayProfit = summaryRows.find(r => r.date === yesterday)?.net_profit || 0;
    const weekProfit = summaryRows.filter(r => r.date >= weekStart && r.date <= today)
      .reduce((a, r) => a + Number(r.net_profit), 0);
    const monthProfit = summaryRows.reduce((a, r) => a + Number(r.net_profit), 0);

    const items = [
      ['오늘', todayProfit],
      ['어제', yesterdayProfit],
      ['최근 7일', weekProfit],
      ['최근 30일', monthProfit],
    ];
    document.getElementById('periodProfit').innerHTML = items.map(([label, v]) => `
      <div>
        <div class="period-label">${label}</div>
        <div class="period-value ${v < 0 ? 'neg' : ''}">${fmt(v)}원</div>
      </div>`).join('');
  }

  // ---------- 구글시트 내보내기 ----------
  function getGoogleAccessToken(){
    return new Promise((resolve, reject) => {
      if(!window.GOOGLE_CONFIG || !window.GOOGLE_CONFIG.clientId || window.GOOGLE_CONFIG.clientId.indexOf('YOUR_') === 0){
        reject(new Error('config.js에 구글 설정이 아직 없습니다. README.md의 구글시트 연동 안내를 먼저 진행해주세요.'));
        return;
      }
      if(typeof google === 'undefined' || !google.accounts){
        reject(new Error('구글 로그인 스크립트를 불러오지 못했습니다. 인터넷 연결을 확인하고 새로고침해주세요.'));
        return;
      }
      const client = google.accounts.oauth2.initTokenClient({
        client_id: window.GOOGLE_CONFIG.clientId,
        scope: 'https://www.googleapis.com/auth/spreadsheets',
        callback: (resp) => {
          if(resp.error){ reject(new Error(resp.error)); return; }
          resolve(resp.access_token);
        },
      });
      client.requestAccessToken();
    });
  }

  async function sheetsApi(token, pathAndQuery, method, body){
    const url = `https://sheets.googleapis.com/v4/spreadsheets/${window.GOOGLE_CONFIG.spreadsheetId}/${pathAndQuery}`;
    const res = await fetch(url, {
      method,
      headers: { Authorization: 'Bearer ' + token, 'Content-Type': 'application/json' },
      body: method === 'GET' ? undefined : JSON.stringify(body || {}),
    });
    if(!res.ok){
      const errBody = await res.text();
      throw new Error(`Sheets API 오류 (${res.status}): ${errBody}`);
    }
    return res.json();
  }

  async function ensureSheetTab(token, title){
    const meta = await sheetsApi(token, '?fields=sheets.properties.title', 'GET');
    const exists = (meta.sheets || []).some(s => s.properties.title === title);
    if(exists) return;
    await sheetsApi(token, ':batchUpdate', 'POST', { requests: [{ addSheet: { properties: { title } } }] });
  }

  async function exportToSheets(){
    const statusEl = document.getElementById('sheetsStatus');
    statusEl.textContent = '구글 로그인 중...';
    try{
      const token = await getGoogleAccessToken();
      statusEl.textContent = '데이터 불러오는 중...';

      const monthStr = todayStr().slice(0, 7);
      const monthStart = monthStr + '-01';
      const monthEnd = todayStr();

      const [summaryRes, shipRes] = await Promise.all([
        db.from('v_daily_summary').select('*').gte('date', monthStart).lte('date', monthEnd).order('date'),
        db.from('shipments').select('quantity, item_id, items(name, unit)').gte('shipped_date', monthStart).lte('shipped_date', monthEnd),
      ]);
      if(summaryRes.error) throw summaryRes.error;
      if(shipRes.error) throw shipRes.error;

      const byItem = {};
      (shipRes.data || []).forEach(r => {
        const name = r.items ? r.items.name : '(미매칭)';
        const unit = r.items ? r.items.unit : '';
        const key = name + '|' + unit;
        byItem[key] = (byItem[key] || 0) + Number(r.quantity || 0);
      });

      const sheetTitle = monthStr;
      statusEl.textContent = '시트 준비 중...';
      await ensureSheetTab(token, sheetTitle);

      const summaryHeader = ['날짜','매출','원물원가','박스비','부자재비','포장비','상품기타비용','폐기손실','택배비','기타비용','인건비','순이익'];
      const summaryRows = (summaryRes.data || []).map(r => [
        r.date, r.revenue, r.raw_cogs, r.box_cost, r.supply_cost, r.packing_cost, r.item_misc_cost,
        r.waste_cost, r.shipping_cost, r.other_cost, r.labor_cost, r.net_profit,
      ]);

      const itemHeader = ['품목', '수량'];
      const itemRows = Object.keys(byItem).map(k => {
        const [name, unit] = k.split('|');
        return [name, byItem[k] + (unit || '')];
      });

      const values = [
        [`${monthStr} 매출/비용/순이익`],
        summaryHeader,
        ...summaryRows,
        [],
        [`${monthStr} 품목별 출고 집계`],
        itemHeader,
        ...itemRows,
      ];

      statusEl.textContent = '쓰는 중...';
      const clearRange = encodeURIComponent(`${sheetTitle}!A1:Z2000`);
      await sheetsApi(token, `values/${clearRange}:clear`, 'POST', {});
      const writeRange = encodeURIComponent(`${sheetTitle}!A1`);
      await sheetsApi(token, `values/${writeRange}?valueInputOption=USER_ENTERED`, 'PUT', { values });

      statusEl.textContent = `${sheetTitle} 시트에 저장 완료 (${new Date().toLocaleTimeString('ko-KR')})`;
    }catch(err){
      console.error(err);
      statusEl.textContent = '내보내기 실패: ' + (err && err.message ? err.message : err);
    }
  }

  function renderCards(summaryRows, stockRows){
    const today = todayStr();
    const todayRow = summaryRows.find(r => r.date === today) || {
      revenue: 0, net_profit: 0, raw_cogs: 0, box_cost: 0, supply_cost: 0, packing_cost: 0, item_misc_cost: 0,
      waste_cost: 0, shipping_cost: 0, other_cost: 0, labor_cost: 0
    };
    const rawTotal = stockRows.filter(s => s.category === '원물').reduce((a, s) => a + Number(s.current_stock), 0);
    const boxTotal = stockRows.filter(s => s.category === '박스').reduce((a, s) => a + Number(s.current_stock), 0);

    document.getElementById('cardRevenue').innerHTML = `
      <div class="card-label">오늘 매출</div>
      <div class="card-value">${fmt(todayRow.revenue)}원</div>
      <div class="card-sub">${today}</div>`;

    const costParts = [
      ['원물원가', todayRow.raw_cogs],
      ['박스비', todayRow.box_cost],
      ['부자재비', todayRow.supply_cost],
      ['포장비', todayRow.packing_cost],
      ['상품기타비용', todayRow.item_misc_cost],
      ['폐기손실', todayRow.waste_cost],
      ['택배비', todayRow.shipping_cost],
      ['인건비', todayRow.labor_cost],
      ['기타비용', todayRow.other_cost],
    ].filter(([, v]) => Number(v) > 0);
    const costBreakdown = costParts.length
      ? costParts.map(([label, v]) => `${label} ${fmt(v)}`).join(' · ')
      : '비용 항목 없음';

    document.getElementById('cardProfit').innerHTML = `
      <div class="card-label">오늘 순이익</div>
      <div class="card-value ${todayRow.net_profit < 0 ? 'neg' : ''}">${fmt(todayRow.net_profit)}원</div>
      <div class="card-sub">매출 - (원물원가+박스비+부자재비+포장비+상품기타비용+폐기+택배비+인건비+기타)</div>
      <div class="card-sub">${costBreakdown}</div>`;

    document.getElementById('cardRaw').innerHTML = `
      <div class="card-label">원물 재고 총량</div>
      <div class="card-value">${fmt(rawTotal)}</div>
      <div class="card-sub">전 품목 합계 (단위 혼재)</div>`;

    document.getElementById('cardBox').innerHTML = `
      <div class="card-label">박스 재고 총량</div>
      <div class="card-value">${fmt(boxTotal)}개</div>
      <div class="card-sub">전 박스종류 합계</div>`;
  }

  function renderTrendChart(rows){
    const el = document.getElementById('trendChart');
    if(!rows.length){ el.innerHTML = '<div class="empty-box">아직 데이터가 없습니다. "오늘 입력"에서 매출을 입력해보세요.</div>'; return; }

    const W = 640, H = 260, padL = 50, padR = 16, padT = 16, padB = 30;
    const innerW = W - padL - padR, innerH = H - padT - padB;
    const n = rows.length;
    const allVals = rows.flatMap(r => [Number(r.revenue), Number(r.net_profit)]);
    const maxVal = Math.max(...allVals, 1) * 1.15;
    const minVal = Math.min(0, ...allVals) * 1.15;
    const range = maxVal - minVal || 1;
    const stepX = n > 1 ? innerW / (n - 1) : 0;

    function xAt(i){ return padL + stepX * i; }
    function yAt(v){ return padT + innerH - ((v - minVal) / range) * innerH; }

    const revPts = rows.map((r, i) => `${xAt(i)},${yAt(Number(r.revenue))}`).join(' ');
    const profitPts = rows.map((r, i) => `${xAt(i)},${yAt(Number(r.net_profit))}`).join(' ');
    const zeroY = yAt(0);

    let labels = '';
    const labelEvery = Math.ceil(n / 6);
    rows.forEach((r, i) => {
      if(i % labelEvery === 0 || i === n - 1){
        labels += `<text x="${xAt(i)}" y="${padT+innerH+18}" text-anchor="middle" font-size="10" fill="#94a3b8">${r.date.slice(5)}</text>`;
      }
    });

    const svg = `
      <svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block;" xmlns="http://www.w3.org/2000/svg">
        <line x1="${padL}" y1="${zeroY}" x2="${padL+innerW}" y2="${zeroY}" stroke="#e2e8f0" stroke-width="1"></line>
        <polyline points="${revPts}" fill="none" stroke="var(--blue)" stroke-width="2"></polyline>
        <polyline points="${profitPts}" fill="none" stroke="var(--green)" stroke-width="2"></polyline>
        ${labels}
      </svg>`;
    el.innerHTML = svg;
  }

  function renderStockValueTotal(rows){
    const el = document.getElementById('stockValueTotal');
    const byCategory = { '원물': 0, '박스': 0, '부자재': 0 };
    let total = 0;
    rows.forEach(r => {
      const v = Number(r.stock_value || 0);
      total += v;
      if(byCategory[r.category] !== undefined) byCategory[r.category] += v;
    });
    el.innerHTML = `
      <div class="total-value">${fmt(total)}원</div>
      <div class="card-sub">원물 ${fmt(byCategory['원물'])} · 박스 ${fmt(byCategory['박스'])} · 부자재 ${fmt(byCategory['부자재'])}</div>`;
  }

  function renderStock(containerId, totalId, rows){
    const el = document.getElementById(containerId);
    const totalEl = document.getElementById(totalId);
    if(!rows.length){
      el.innerHTML = '<div class="empty-box">등록된 품목이 없습니다.</div>';
      if(totalEl) totalEl.innerHTML = '';
      return;
    }
    const max = Math.max(...rows.map(r => Number(r.current_stock)), 1);
    const totalValue = rows.reduce((a, r) => a + Number(r.stock_value || 0), 0);
    if(totalEl) totalEl.innerHTML = `이 카테고리 재고 비용 <b>${fmt(totalValue)}원</b>`;
    el.innerHTML = rows.map(r => `
      <div class="stock-row">
        <span class="stock-name">${r.name}</span>
        <div class="stock-bar-track"><div class="stock-bar-fill" style="width:${Math.max(0, Number(r.current_stock)/max*100).toFixed(1)}%"></div></div>
        <span class="stock-amount">${fmt(r.current_stock)}${r.unit}</span>
        <span class="stock-value">${fmt(r.stock_value)}원</span>
      </div>`).join('');
  }

  function renderWasteTable(rows){
    const el = document.getElementById('wasteTable');
    if(!rows.length){ el.innerHTML = '<div class="empty-box">최근 폐기 내역이 없습니다.</div>'; return; }
    el.innerHTML = `
      <table class="waste-table">
        <thead><tr><th>날짜</th><th>품목</th><th>수량</th><th>사유</th></tr></thead>
        <tbody>
          ${rows.map(r => `<tr>
            <td>${r.movement_date}</td>
            <td>${r.items ? r.items.name : ''}</td>
            <td>${fmt(r.quantity)}${r.items ? r.items.unit : ''}</td>
            <td>${r.note || '-'}</td>
          </tr>`).join('')}
        </tbody>
      </table>`;
  }

  async function loadDashboard(){
    try{
      const since = new Date(Date.now() - 29*86400000);
      const sinceStr = new Date(since - since.getTimezoneOffset()*60000).toISOString().slice(0,10);

      const [summary, stock] = await Promise.all([
        db.from('v_daily_summary').select('*').gte('date', sinceStr).order('date', { ascending: true }),
        db.from('v_stock_current').select('*').order('current_stock', { ascending: false }),
      ]);
      if(summary.error) throw summary.error;
      if(stock.error) throw stock.error;

      renderCards(summary.data || [], stock.data || []);
      renderPeriodProfit(summary.data || []);
      renderTrendChart(summary.data || []);
      renderStock('rawStock', 'rawStockTotal', (stock.data || []).filter(s => s.category === '원물'));
      renderStock('boxStock', 'boxStockTotal', (stock.data || []).filter(s => s.category === '박스'));
      renderStock('supplyStock', 'supplyStockTotal', (stock.data || []).filter(s => s.category === '부자재'));
      renderStockValueTotal(stock.data || []);
      loadWasteRange();
    }catch(err){
      console.error(err);
      document.getElementById('app').innerHTML =
        `<div class="topbar"><h1>재고·순이익 대시보드</h1><a class="input-link" href="input.html">+ 오늘 입력</a></div>
         <div class="card error-box">데이터를 불러오지 못했습니다.<br>${(err && err.message) ? err.message : err}<br><br>
         config.js에 Supabase URL/anon key가 올바르게 설정되어 있는지 확인해주세요.</div>`;
    }
  }

  loadDashboard();
</script>
