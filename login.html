<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>로그인</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
<style>
  :root{
    --blue:#2563eb; --blue-dark:#1d4ed8; --blue-bg:#eff6ff;
    --text:#0f172a; --sub:#64748b; --line:#e5e7eb; --red:#dc2626;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
    background:#f8fafc; color:var(--text); font-family:'Pretendard Variable','Pretendard',-apple-system,BlinkMacSystemFont,sans-serif;
  }
  .card{
    width:100%; max-width:340px; background:#fff; border:1px solid var(--line); border-radius:16px;
    padding:28px 24px; box-shadow:0 4px 16px rgba(15,23,42,0.06); margin:16px;
  }
  h1{ font-size:19px; font-weight:700; margin:0 0 20px; text-align:center; }
  .field{ margin-bottom:14px; }
  .field label{ display:block; font-size:12px; color:var(--sub); font-weight:600; margin-bottom:5px; }
  .field input{
    width:100%; padding:11px 12px; border:1px solid var(--line); border-radius:10px;
    font-size:15px; font-family:inherit; background:#fff;
  }
  .btn{
    width:100%; padding:12px; border:none; border-radius:10px; background:var(--blue); color:#fff;
    font-size:15px; font-weight:700; cursor:pointer; font-family:inherit; margin-top:6px;
  }
  .btn:disabled{ background:#94a3b8; cursor:not-allowed; }
  .msg{ font-size:13px; color:var(--red); margin-top:12px; text-align:center; min-height:16px; }
</style>
</head>
<body>

<div class="card">
  <h1>재고·순이익 관리 시스템</h1>
  <div class="field"><label>아이디</label><input type="text" id="loginId" autocomplete="username"></div>
  <div class="field"><label>비밀번호</label><input type="password" id="loginPw" autocomplete="current-password"></div>
  <button class="btn" id="loginBtn" onclick="doLogin()">로그인</button>
  <div class="msg" id="loginMsg"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script>
  const { createClient } = supabase;
  let db = null;
  try{
    db = createClient(window.SUPABASE_CONFIG.url, window.SUPABASE_CONFIG.anonKey);
  }catch(e){
    document.querySelector('.card').innerHTML =
      '<h1>로그인</h1><div class="msg">config.js에 Supabase 설정이 아직 없습니다. README.md의 1단계를 먼저 진행해주세요.</div>';
    throw e;
  }

  const LOGIN_DOMAIN = '@login.local';

  function getRedirectTarget(){
    const params = new URLSearchParams(location.search);
    return params.get('redirect') || 'index.html';
  }

  async function doLogin(){
    const id = document.getElementById('loginId').value.trim();
    const pw = document.getElementById('loginPw').value;
    const msgEl = document.getElementById('loginMsg');
    const btn = document.getElementById('loginBtn');
    if(!id || !pw){ msgEl.textContent = '아이디와 비밀번호를 입력하세요'; return; }
    btn.disabled = true;
    msgEl.textContent = '';
    const email = id.includes('@') ? id : id + LOGIN_DOMAIN;
    const { error } = await db.auth.signInWithPassword({ email, password: pw });
    if(error){
      msgEl.textContent = '로그인 실패: 아이디 또는 비밀번호가 올바르지 않습니다';
      btn.disabled = false;
      return;
    }
    location.href = getRedirectTarget();
  }

  document.getElementById('loginPw').addEventListener('keydown', e => { if(e.key === 'Enter') doLogin(); });
  document.getElementById('loginId').addEventListener('keydown', e => { if(e.key === 'Enter') doLogin(); });

  // 이미 로그인되어 있으면 바로 이동
  db.auth.getSession().then(({ data }) => {
    if(data.session) location.href = getRedirectTarget();
  });
</script>

</body>
</html>
